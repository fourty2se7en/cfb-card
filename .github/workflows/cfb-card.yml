# College football card. Same shape as the NFL workflow.
#
# The CFBD key comes from the encrypted repository secret and is passed as an
# environment variable. fetch_data.py sends it in an Authorization header, never
# in a URL — URLs leak into logs and error messages, headers do not.
#
# TIMES ARE UTC. Phoenix is UTC-7 year round.
# College plays mostly Saturday, with Thursday and Friday games and the odd
# midweek MACtion, so the refresh runs daily rather than on named days.

name: cfb-card

on:
  schedule:
    - cron: "31 16 * * 2"      # Tue 09:31 Phoenix - new week, full rebuild
    - cron: "19 15 * * *"      # daily 08:19 Phoenix - refresh
    - cron: "47 07 * * *"      # daily 00:47 Phoenix - grade completed games
  workflow_dispatch:
    inputs:
      season:
        description: "Season year"
        required: false
        default: "2026"

concurrency:
  group: cfb-card
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch CFBD data
        working-directory: scripts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python3 fetch_data.py

      - name: Build power ratings
        working-directory: scripts
        run: python3 build_ratings.py

      - name: Show what came back
        working-directory: scripts
        run: |
          echo '--- files ---'
          ls -la data/
          echo '--- ratings head ---'
          head -12 data/power_ratings.csv
          echo '--- lines sample ---'
          head -4 data/lines.csv 2>/dev/null || echo 'no lines.csv'

      - name: Commit data
        run: |
          git config user.name  "cfb-card-bot"
          git config user.email "cfb-card-bot@users.noreply.github.com"
          git add -A scripts/data || true
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push || true
