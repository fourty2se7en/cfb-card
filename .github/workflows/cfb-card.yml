# College football card. Same shape as the NFL workflow, moved onto the college
# week.
#
# The NFL rebuilds on Tuesday because its week ends Monday night. College's week
# ends Saturday night, so the new card is released Sunday morning, once the last
# game of the week is final. From there it refreshes every morning and grades
# every night, which is what keeps Thursday, Friday and midweek MACtion results
# flowing into the card as they happen rather than waiting for the weekend.
#
#   Sunday 07:00 Phoenix   full rebuild. New week, new card.
#   daily  08:30 Phoenix   refresh. New lines, ratings updated for any games
#                          that finished, card re-rendered.
#   daily  01:15 Phoenix   grade. Completed games settle into the ledger.
#
# TIMES BELOW ARE UTC. Phoenix is UTC-7 year round, so add 7 to read them.
#
# The CFBD key comes from the encrypted repository secret and is passed as an
# environment variable. fetch_data.py sends it in an Authorization header, never
# in a URL - URLs leak into logs and error messages, headers do not.

name: cfb-card

on:
  schedule:
    - cron: "0 14 * * 0"       # Sun 07:00 Phoenix - new week, full rebuild
    - cron: "30 15 * * *"      # daily 08:30 Phoenix - refresh
    - cron: "15 8 * * *"       # daily 01:15 Phoenix - grade completed games
  workflow_dispatch:
    inputs:
      season:
        description: "Season year"
        required: false
        default: "2026"
      mode:
        description: "rebuild, refresh or grade"
        required: false
        default: "rebuild"

concurrency:
  group: cfb-card
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Which of the three runs is this? A manual run says so directly.
      - name: Decide the mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "0 14 * * 0")  M=rebuild ;;
            "30 15 * * *") M=refresh ;;
            "15 8 * * *")  M=grade ;;
            *)             M="${{ github.event.inputs.mode || 'rebuild' }}" ;;
          esac
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "this run is a $M"

      - name: Fetch CFBD data
        working-directory: scripts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python3 fetch_data.py

      - name: Build power ratings
        working-directory: scripts
        run: python3 build_ratings.py

      # The card renderer is not committed yet. Until it is, this step is a
      # no-op rather than a red X, and the schedule above is already driving it.
      - name: Build the card
        working-directory: scripts
        env:
          CFB_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ -f cfb_card.py ]; then
            python3 cfb_card.py
          else
            echo "cfb_card.py is not committed yet, so there is no page to build."
            echo "Ratings and data are current. Mode would have been: $CFB_MODE"
          fi

      - name: Show what came back
        working-directory: scripts
        run: |
          echo '--- mode ---'
          echo '${{ steps.mode.outputs.mode }}'
          echo '--- files ---'
          ls -la data/
          echo '--- ratings head ---'
          head -12 data/power_ratings.csv
          echo '--- lines sample ---'
          head -4 data/lines.csv 2>/dev/null || echo 'no lines.csv'

      - name: Commit data
        run: |
          git config user.name  "cfb-card-bot"
          git config user.email "cfb-card-bot@users.noreply.github.com"
          # Separate adds. Passing a path that does not exist yet makes git add
          # fail and stage NOTHING, which silently skipped a whole run's data.
          git add -A scripts/data || true
          [ -d docs ] && git add -A docs || true
          git diff --staged --quiet || git commit -m "${{ steps.mode.outputs.mode }}: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push || true
