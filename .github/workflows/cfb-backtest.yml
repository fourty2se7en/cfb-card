# Backtest. Manual only, never on a schedule, and it writes nothing to the repo.
#
# The answer is the run log. Open the run, expand "Run the backtest", and read
# the win% column against 52.4%.
#
# The key comes from the encrypted repository secret and is passed as an
# environment variable. cfb_backtest.py sends it in an Authorization header,
# never in a URL.

name: cfb-backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run the backtest
        working-directory: scripts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 -u cfb_backtest.py
