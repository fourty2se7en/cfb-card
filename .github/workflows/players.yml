# Player and team stat pulls for the Season Cards prop models and the game card "Season stats" block (Trina, Nov 14 2026, B115),
# so prop runs never need Chrome. season/players_pull.py explains every file it writes.
# Daily: season/loop.py runs "players_pull.py all" after 09:15 Phoenix and the NBA season_raw rebuild after props_open (10:05).
# This workflow is the backup schedule and the on-demand pull. TIMES ARE UTC; Phoenix is UTC-7 year round.
#   16:45 UTC = 9:45 AM Phoenix   all (skipped when the loop already pulled today)
# On demand: Run workflow (mode, sports, date), the REST dispatch
#   gh api -X POST repos/fourty2se7en/cfb-card/actions/workflows/players.yml/dispatches -f ref=main -f 'inputs[mode]=all'
# or edit season/players_run.txt (first word = mode, second = sports) and push.
name: players

on:
  schedule:
    - cron: "45 16 * * *"
  push:
    branches: [main]
    paths: [season/players_run.txt]
  workflow_dispatch:
    inputs:
      mode:
        description: "all, teams, nba, nba_raw, nhl, fbs or backfill"
        required: false
        default: "all"
      sports:
        description: "comma list (nba,nhl,ncaam,ncaaw,nfl,fbs); empty = all"
        required: false
        default: ""
      date:
        description: "YYYY-MM-DD Phoenix; empty = today"
        required: false
        default: ""

concurrency:
  group: players
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Which pull
        id: mode
        run: |
          day=$(TZ=America/Phoenix date +%F)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if grep -q "\"players_am\": \"$day\"" season/state.json 2>/dev/null; then echo "mode=skip" >> "$GITHUB_OUTPUT"; else echo "mode=all" >> "$GITHUB_OUTPUT"; fi
            echo "sports=" >> "$GITHUB_OUTPUT"; echo "date=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            m=$(head -1 season/players_run.txt | cut -d' ' -f1); s=$(head -1 season/players_run.txt | cut -s -d' ' -f2)
            case "$m" in all|teams|nba|nba_raw|nhl|fbs|backfill) ;; *) m=all ;; esac
            echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "sports=$s" >> "$GITHUB_OUTPUT"; echo "date=" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode || 'all' }}" >> "$GITHUB_OUTPUT"
            echo "sports=${{ github.event.inputs.sports }}" >> "$GITHUB_OUTPUT"; echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull
        if: steps.mode.outputs.mode != 'skip'
        run: python3 season/players_pull.py "${{ steps.mode.outputs.mode }}" "${{ steps.mode.outputs.sports }}" "${{ steps.mode.outputs.date }}"
      - name: Commit
        if: steps.mode.outputs.mode != 'skip'
        run: |
          git config user.name  "cfb-card-bot"
          git config user.email "cfb-card-bot@users.noreply.github.com"
          git add -A season/data || true
          git diff --staged --quiet && exit 0
          git commit -q -m "players ${{ steps.mode.outputs.mode }}: $(date -u +%Y-%m-%dT%H:%MZ)"
          bash season/push_retry.sh
