</style></head><body>
<title>Season Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Sedgwick+Ave+Display&display=swap">
<style>
/* Tokens: dark first (warm chocolate), latte light. */
:root{
  color-scheme:dark;
  --bg:#17120F;--surface:#221B17;--surface2:#1C1613;--surface3:#271F1A;--raise:#2A211C;--line:#352B25;--line2:#2C241E;--line3:#463A31;
  --ink:#F0E8E1;--muted:#ADA196;--faint:#7E7268;--soft:#D5CBC2;
  --accent:#FF9A3C;--accent-ink:#1A120C;--caramel:#D8B48A;--link:#E2C49F;--link-h:#EED7B8;
  --good:#3DD68C;--bad:#FF7A70;--good-bg:#0F2E22;--bad-bg:#3A1E1B;--off-bg:#2C241E;
  --tile-top:#2A211C;--tile-bot:#221B17;--pk-bg:#1E1814;--pop-bg:#2A211C;--pop-line:#5A4636;--shadow:0 18px 44px rgba(0,0,0,.6);
  --band:linear-gradient(120deg,#241912 0%,#3A2416 55%,#5A2E12 100%);--band-ink:#FFFFFF;--band-tab:#E6D5C3;
  --spark-zero:#4A3E35;--sel:#2E2219;--sw-bg:#17120F;--sw-on:#352B25;
  --solid-ink:#F6CF7E;--solid-line:#E9B65A;--solid-glow:rgba(233,182,90,.25);
  --m-badge:#4FA3FF;--m-ink:#8CC2FF;--w-badge:#FF7FB6;--w-ink:#FFA9CF;--badge-bg:#1A120C;
  --rain-bg:#1D1F22;--rain-drop:rgba(150,190,240,.12);--rain-ink:#A9CCF5;--rain-chip:rgba(120,170,230,.16);
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#DDD2C4;--surface:#EAE2D7;--surface2:#E4DACD;--surface3:#E4DACD;--raise:#EFE8DE;--line:#CABDAC;--line2:#D3C7B8;--line3:#BFB1A0;
  --ink:#2A231E;--muted:#665B51;--faint:#7D7166;--soft:#3F362F;
  --accent:#C2601A;--accent-ink:#FFF7EE;--caramel:#B9571A;--link:#6E4A2B;--link-h:#4F341E;
  --good:#1E7A4E;--bad:#B23B36;--good-bg:#CFE0CC;--bad-bg:#F0D3CE;--off-bg:#D3C7B8;
  --tile-top:#EFE8DE;--tile-bot:#EAE2D7;--pk-bg:#E8DFD3;--pop-bg:#EFE8DE;--pop-line:#BFB1A0;--shadow:0 12px 32px rgba(16,24,40,.18);
  --band:linear-gradient(120deg,#EADBC6 0%,#DDB88C 50%,#C97B3A 100%);--band-ink:#22190F;--band-tab:#3F2A18;
  --spark-zero:#BFB1A0;--sel:#F3E4D0;--sw-bg:#D3C7B8;--sw-on:#EAE2D7;
  --solid-ink:#8A5A12;--solid-line:#B88A3A;--solid-glow:rgba(184,138,58,.18);
  --m-badge:#2F6FC0;--m-ink:#2F6FC0;--w-badge:#C2457F;--w-ink:#C2457F;--badge-bg:#EAE2D7;
  --rain-bg:#EDECE8;--rain-drop:rgba(40,85,140,.12);--rain-ink:#24507F;--rain-chip:rgba(40,95,160,.13);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#DDD2C4;--surface:#EAE2D7;--surface2:#E4DACD;--surface3:#E4DACD;--raise:#EFE8DE;--line:#CABDAC;--line2:#D3C7B8;--line3:#BFB1A0;
  --ink:#2A231E;--muted:#665B51;--faint:#7D7166;--soft:#3F362F;
  --accent:#C2601A;--accent-ink:#FFF7EE;--caramel:#B9571A;--link:#6E4A2B;--link-h:#4F341E;
  --good:#1E7A4E;--bad:#B23B36;--good-bg:#CFE0CC;--bad-bg:#F0D3CE;--off-bg:#D3C7B8;
  --tile-top:#EFE8DE;--tile-bot:#EAE2D7;--pk-bg:#E8DFD3;--pop-bg:#EFE8DE;--pop-line:#BFB1A0;--shadow:0 12px 32px rgba(16,24,40,.18);
  --band:linear-gradient(120deg,#EADBC6 0%,#DDB88C 50%,#C97B3A 100%);--band-ink:#22190F;--band-tab:#3F2A18;
  --spark-zero:#BFB1A0;--sel:#F3E4D0;--sw-bg:#D3C7B8;--sw-on:#EAE2D7;
  --solid-ink:#8A5A12;--solid-line:#B88A3A;--solid-glow:rgba(184,138,58,.18);
  --m-badge:#2F6FC0;--m-ink:#2F6FC0;--w-badge:#C2457F;--w-ink:#C2457F;--badge-bg:#EAE2D7;
  --rain-bg:#EDECE8;--rain-drop:rgba(40,85,140,.12);--rain-ink:#24507F;--rain-chip:rgba(40,95,160,.13);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--link)}a:hover{color:var(--link-h)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media (min-width:900px){.wrap{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}}

/* Top bar */
.top{background:var(--surface2);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.05;flex:0 0 auto}
.brand b{font:800 26px 'Barlow Semi Condensed',sans-serif;letter-spacing:.01em}
.brand b span{color:var(--accent)}
.brand small{font-size:12px;color:var(--muted)}
.sports{display:flex;align-items:flex-end;gap:4px;flex:1 1 auto;justify-content:center;min-width:0}
.sb{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:6px 8px;border-radius:14px;cursor:pointer;color:var(--muted);font:600 12px/1.2 Inter,sans-serif;flex:0 0 auto;white-space:nowrap;min-height:44px}
.sb:hover{background:var(--raise);color:var(--ink)}
.sb[aria-pressed="true"]{background:var(--sel);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.sb .ic{position:relative;display:block;width:44px;height:44px}
.sb .ic svg{width:44px;height:44px;display:block}
.sb .bdg{position:absolute;right:-6px;top:-4px;width:20px;height:20px;border-radius:10px;background:var(--badge-bg);font:800 10px/16px Inter,sans-serif;text-align:center;border:2px solid}
.sb .bdg.m{border-color:var(--m-badge);color:var(--m-ink)}.sb .bdg.w{border-color:var(--w-badge);color:var(--w-ink)}
.sep{width:1px;height:50px;background:var(--line);margin:0 6px;flex:0 0 auto;align-self:center}
.theme{display:flex;gap:2px;padding:3px;background:var(--sw-bg);border:1px solid var(--line);border-radius:12px;flex:0 0 auto}
.theme button{display:flex;align-items:center;gap:6px;border:0;border-radius:9px;padding:7px 11px;min-height:36px;background:transparent;color:var(--muted);font:600 13px Inter,sans-serif;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--sw-on);color:var(--ink)}
@media (max-width:760px){
  .top .wrap{gap:8px 12px}
  .brand{flex:1 1 auto}
  .sports{order:3;flex:1 0 100%;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .sports::-webkit-scrollbar{display:none}
  .sb .ic,.sb .ic svg{width:36px;height:36px}
  .sep{height:40px}
  .theme button{padding:6px 8px;font-size:12px}
}

/* Sport band */
.band{background:var(--band);border-bottom:1px solid var(--line);color:var(--band-ink)}
.band .wrap{padding-top:22px;display:flex;flex-direction:column;gap:12px}
.band-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.band h1{margin:0;font:800 44px/.95 'Barlow Semi Condensed',sans-serif;letter-spacing:.01em}
.status{font-size:14px;color:var(--band-tab);padding-bottom:4px}
.div{display:flex;padding:3px;background:rgba(0,0,0,.22);border-radius:12px}
:root[data-theme="light"] .div{background:rgba(255,255,255,.35)}
.div button{border:0;border-radius:9px;padding:6px 16px;min-height:36px;background:transparent;color:var(--band-tab);font:700 14px Inter,sans-serif;cursor:pointer}
.div button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 2px;font:600 14px Inter,sans-serif;color:var(--band-tab);background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;min-height:44px}
.tab[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--accent)}
@media (max-width:640px){.band h1{font-size:36px}.tabs{gap:18px}}

/* Main */
main.wrap{padding-top:22px;padding-bottom:48px;display:flex;flex-direction:column;gap:20px}
.lbl{font:600 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.tile{background:linear-gradient(180deg,var(--tile-top) 0%,var(--tile-bot) 100%);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.tv{font:800 32px/1.1 'Barlow Semi Condensed',sans-serif;margin-top:4px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
@media (max-width:640px){.tv{font-size:26px}}
.pb{font:700 13px Inter,sans-serif;color:var(--accent-ink);background:var(--caramel);border:0;border-radius:8px;padding:5px 12px;min-height:30px;min-width:34px;cursor:pointer}
.pb.hot{background:var(--accent)}
.pb[disabled]{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:16px 20px;flex-wrap:wrap}
.ph h2{margin:0;font:800 23px 'Barlow Semi Condensed',sans-serif}
.ph .sub{font-size:13px;color:var(--muted)}
details.cp>summary{cursor:pointer;list-style:none;min-height:44px}
details.cp>summary::-webkit-details-marker{display:none}
details.cp>summary h2:after{content:'›';display:inline-block;margin-left:10px;transition:transform .15s;color:var(--muted);font-weight:700}
details.cp[open]>summary h2:after{transform:rotate(90deg)}
details.cp:not([open])>summary{padding-bottom:16px!important}
.wbl{padding:0 20px 16px;display:grid;gap:12px}
.wb{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.wb-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wb .plist{margin-top:4px}
.gq{flex:1 1 260px;max-width:420px}.gqw{position:relative;display:flex}
.gqw input{width:100%;min-height:44px;padding:8px 40px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px Inter,sans-serif}
.gqw input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.gqw input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gqw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.gqn{margin:4px 0 6px}
.dvc{display:inline-flex;align-items:center;justify-content:center;font:800 11px 'Barlow Semi Condensed',Inter,sans-serif;letter-spacing:.04em;padding:3px 6px;min-width:30px;border:1.5px solid var(--line);border-radius:7px;color:var(--ink);background:var(--surface2);vertical-align:middle;margin-left:6px;line-height:1}
.mu2 .dvc{margin-left:4px;padding:2px 4px;min-width:0;font-size:10px}
.ex .bothx{grid-column:1/-1;font-size:12px;color:var(--bad)}
.pl5{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.pl5 b{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:2px 4px}
.pl5 b.o{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pl5 b.u{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pl5 b.p{background:var(--surface2)}
.eptools{padding:0 20px 10px}
.szg.one{grid-template-columns:1fr!important}
.mxt tr.sub td:first-child{padding-left:28px}
.thx>summary{cursor:pointer;font-size:13px;font-weight:700;padding:8px 0;min-height:36px;list-style:none}
.thx>summary::-webkit-details-marker{display:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
table.rt{min-width:960px}
table.ht{min-width:620px}
table.ep{min-width:760px}
td,th{padding:11px 16px;text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
td:first-child,th:first-child{text-align:left}
th{background:var(--surface2);white-space:nowrap}
td.c,th.c{text-align:center}
td.l,th.l{text-align:left}
tbody tr td{border-top:1px solid var(--line2)}
tr.grp td{border-top:1px solid var(--line);font-weight:700;background:var(--surface3)}
tr.sub td:first-child{padding-left:36px}
tr.pk td{border-top:1px dashed var(--line);background:var(--pk-bg)}
tr.pk td:first-child{padding-left:36px}
tr.pk.fade{opacity:.68}
tr.none td{border-top:1px dashed var(--line2);font-size:12.5px;color:var(--faint);padding-top:8px;padding-bottom:8px}
tr.none td:first-child{padding-left:36px}
tr.mu td{color:var(--faint)}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}.mu{color:var(--faint)}
.pkb{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);font:600 14px Inter,sans-serif;text-align:left;cursor:pointer;flex-wrap:wrap}
.pkb small{font:500 12px Inter,sans-serif;color:var(--muted)}
.pkb .pr{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:4px;background:var(--accent);box-shadow:0 0 8px rgba(255,154,60,.7);flex:0 0 auto}
.dot.mute{background:var(--faint);box-shadow:none}
.det{font:600 12px Inter,sans-serif;color:var(--link);background:none;border:0;cursor:pointer;white-space:nowrap;padding:6px 0;min-height:30px}
.stk{display:inline-block;font:700 11px Inter,sans-serif;padding:3px 8px;border-radius:999px}
.sw{background:var(--good-bg);color:var(--good)}.sl{background:var(--bad-bg);color:var(--bad)}
.chip{display:inline-block;font:700 11px Inter,sans-serif;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.w{background:var(--good-bg);color:var(--good)}.chip.l{background:var(--bad-bg);color:var(--bad)}.chip.off,.chip.p{background:var(--off-bg);color:var(--muted)}
.chip.on{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--bad-bg);color:var(--bad)}.chip.close{background:var(--sel);color:var(--accent)}.rs td.l{max-width:360px}.rs .gapm{display:none}@media (max-width:640px){table.ht.rs{min-width:0}.rs th:nth-child(n+4),.rs td:nth-child(n+4){display:none}.rs thead{display:none}.rs tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}.rs td{border:0!important;text-align:left!important}.rs td:first-child{grid-column:1/-1;padding-bottom:2px}.rs td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.rs .gapm{display:block;margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.4}.rs .gapm .chip{margin-right:6px}}.rs .gap{color:var(--muted);font-size:12.5px;margin-top:3px}.rec{white-space:nowrap}.chip.pend{background:var(--sel);color:var(--accent)}

/* Graffiti tier tags */
.t-strong,.t-solid,.t-lean{display:inline-block;font:400 17px/1 'Sedgwick Ave Display',cursive;white-space:nowrap}
.t-strong{color:#1A0F08;background:linear-gradient(100deg,#FFD866 0%,#FF9A3C 55%,#FF6A2B 100%);padding:5px 12px 4px;border-radius:8px;transform:rotate(-3deg);box-shadow:0 0 14px rgba(255,138,52,.55)}
.t-solid{color:var(--solid-ink);border:1.5px solid var(--solid-line);padding:4px 11px 3px;border-radius:8px;transform:rotate(-2deg);box-shadow:0 0 8px var(--solid-glow)}
.t-lean{color:var(--faint);padding:4px 6px;transform:rotate(-2deg)}
.sm .t-strong,.t-strong.sm{font-size:14px;padding:3px 9px}
.t-solid.sm{font-size:14px;padding:2px 8px}

/* Messages */
.note{padding:14px 18px;border:1px dashed var(--line3);border-radius:12px;color:var(--muted);font-size:14px;background:var(--surface)}
.note.warn{border-color:var(--bad);color:var(--ink)}
.empty{padding:14px 20px 20px;color:var(--faint);font-size:13px}

/* Filters */
.filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sel{display:flex;flex-direction:column;gap:4px;font:600 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:relative;min-width:0}
.sel select,.sel>button{font:500 14px Inter,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line3);border-radius:10px;padding:9px 12px;min-height:44px;text-transform:none;letter-spacing:0;max-width:220px}
.sel>button{display:flex;align-items:center;gap:10px;cursor:pointer}
@media (max-width:640px){.filters{display:grid;grid-template-columns:1fr 1fr}.sel select,.sel>button{max-width:none;width:100%}.sel.dates{grid-column:1 / -1}}
.cal{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:300px;max-width:calc(100vw - 32px);background:var(--pop-bg);border:1px solid var(--pop-line);border-radius:14px;box-shadow:var(--shadow);padding:12px;text-transform:none;letter-spacing:0;color:var(--ink)}
.cal .pre{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cal .pre button,.cal .nav button{font:600 12px Inter,sans-serif;border:1px solid var(--line3);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 9px;cursor:pointer;min-height:32px}
.cal .nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font:700 14px Inter,sans-serif}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .g span{font:600 10px Inter,sans-serif;color:var(--faint);padding:4px 0}
.cal .g button{border:0;background:none;border-radius:8px;min-height:34px;font:500 13px Inter,sans-serif;color:var(--ink);cursor:pointer}
.cal .g button.hp{font-weight:800}
.cal .g button.in{background:var(--sel)}
.cal .g button.edge{background:var(--accent);color:var(--accent-ink)}
.cal .g button.td{box-shadow:inset 0 0 0 1px var(--accent)}
.cal .g button:disabled{visibility:hidden}
.cal .hint{font-size:12px;color:var(--muted);margin-top:8px}

/* Dialog */
dialog.pop{background:var(--pop-bg);color:var(--ink);border:1px solid var(--pop-line);border-radius:16px;box-shadow:var(--shadow);padding:0;width:min(460px,calc(100vw - 24px));max-height:86vh}
dialog.pop::backdrop{background:rgba(10,6,4,.55)}
.pin{padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:86vh}
.pop-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pop-h h3{margin:0;font:700 16px/1.3 Inter,sans-serif}
.pop-h .sub{font-size:12px;color:var(--muted);margin-top:3px}
.x{border:0;background:none;font-size:24px;line-height:1;min-width:40px;min-height:40px;color:var(--muted);cursor:pointer;border-radius:10px;flex:0 0 auto}
.x:hover{background:var(--surface)}
.box{padding:10px 12px;border-radius:10px;background:var(--surface);font-size:13px}
.sig{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:13px;align-items:baseline}
.sig>span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:7px;flex-shrink:0}

/* ---------------- model: classify picks into groups ---------------- */
function isPropLean(p){return p.market==='Prop'&&(/^lean$/i.test(String(p.tier||''))||p.tracking===true);}

function propCat(stat,rule){

  if(/^(pra|p\s*\+\s*r\s*\+\s*a|pts\s*\+\s*reb\s*\+\s*ast|points\s*\+\s*rebounds\s*\+\s*assists)$/.test(s))return 'Points + rebounds + assists';
  if(/pass.*(td|touchdown)/.test(s))return 'Passing touchdowns';
  if(/^pass(ing)?( yds| yards)?$|^passing yards$/.test(s))return 'Passing yards';
  if(/^receptions?$/.test(s))return 'Receptions';
  if(/^rec(eiving)?( yds| yards)?$/.test(s))return 'Receiving yards';
  if(/^rush(ing)?( yds| yards)?$/.test(s))return 'Rushing yards';
  if(/three|3 ?pointers|^3pm$|^3s$/.test(s))return 'Threes';
  if(/^reb/.test(s))return 'Rebounds';
  if(/^ast|assist/.test(s))return 'Assists';
  if(/^sog$|shot/.test(s))return 'Shots on goal';
  if(/goal/.test(s))return 'Goals';

/* Tiers (Trina, Nov 9): each rule's record is kept by tier. meta.rules[].tiers[Tier] = {season, month, n, on, upgraded}.
   An upgraded tier of an inactive rule makes card picks; meta.retier maps old card picks to the one tier scale. */
function tierOf(p){return titleTier(p&&p.tier);}
function tierRecOf(R,t){var m=R&&(R.meta||R),T=m&&m.tiers;return T&&T[t]?T[t]:null;}

  if(sport==='nba'){if(m==='Total'){var tc=i.total_scores||{};return sc3((tc.U||0)-(tc.O||0));}var ss=i.side_scores||{},side=String(b.pick||'').indexOf(b.away)===0?b.away:b.home,oth=side===b.away?b.home:b.away;return sc3((ss[side]||0)-(ss[oth]||0));}

  rules.forEach(function(R){if(csRule(R)||R.market!=='Prop'||!R.on||(R.meta.keys&&!R.meta.keys.length))return;var sd=/\bunder\b/i.test(R.key)?'Under':/\bover\b/i.test(R.key)?'Over':'';var g=groups['pr:'+propCat('',R.key)+(sd?' · '+sd:'')];if(g&&g.metaRules.indexOf(R)<0)g.metaRules.push(R);});

/* A61: a bet is one game, one market, one side at one line. Price may differ slightly between rules. */
function normPk(t){return String(t==null?'':t).toUpperCase().replace(/\s+/g,' ').replace(/([+-]?)(\d+(?:\.\d+)?)/g,function(m,sg,n){return (sg==='-'?'-':(sg==='+'?'+':''))+String(+n);}).trim();}

/* Rule families: rule_family when the meta has it, else the label without its band suffix; split rules that share
   their first three words in the same market are one family. */

  meta.rules.forEach(function(r){var L=r.label||r.key||'';if(r.rule_family){out[L]=r.rule_family;return;}if(r.market==='Prop'){out[L]=String(L).split(' · ')[0]+' props';return;}
    var b=String(L).replace(/,?\s+(?:\d+(?:\.\d+)?\s+to\s+\d+(?:\.\d+)?|\d+(?:\.\d+)?(?:\+|%\+?)?)$/,'').trim();(by[r.market||'']=by[r.market||'']||[]).push({L:L,b:b,w:b.replace(/,/g,'').split(/\s+/)});});
  Object.keys(by).forEach(function(mk){var A=by[mk],par=A.map(function(_,i){return i;});function f(i){return par[i]===i?i:(par[i]=f(par[i]));}
    function cp(a,b){var n=0;while(n<a.length&&n<b.length&&a[n].toLowerCase()===b[n].toLowerCase())n++;return n;}
    for(var i=0;i<A.length;i++)for(var j=i+1;j<A.length;j++)if(A[i].b===A[j].b||cp(A[i].w,A[j].w)>=3)par[f(j)]=f(i);

/* ---------------- Summary tab (A56, Trina Nov 15) ----------------
   One tab beside the sports. Lists today's Active picks from every sport whose tier has a proven record.
   Threshold (approved Nov 15): the tier is on (Active pick), 8+ graded picks in its season record,
   +0.10u per pick or better season to date, and the last 14 days not negative.
   The same test is run on every past card pick using only the record before that pick's date,
   so "Top performers record" shows how the list itself has done. */
var SUMT={min:8,ppp:0.10,days:14};
function openSummary(){var keep=IDS.indexOf(S.sport)>=0?S.sport:'nba';S.view='summary';S.sport=keep;lsSet(LS_SPORT,'summary');
  if(window.parent===window&&location.hash!=='#summary'){try{history.replaceState(null,'','#summary');}catch(e){location.hash='summary';}}
  IDS.forEach(function(sp){subscribe(sp);});paintNav();render();}
function topTest(M,p,before,cache){var k=rrKey(M,p),RC=cache&&cache[k];if(!RC){RC=ruleRecOf(M,p);if(cache)cache[k]=RC;}
  var ser=(RC.series||[]).filter(gradedP),uf=RC.uf||units;if(before)ser=ser.filter(function(x){return String(x.date)<before;});
  var n=ser.length,u=ser.reduce(function(s,x){return s+uf(x);},0),cut=addDays(before||TODAY,-SUMT.days);
  var l=ser.filter(function(x){return String(x.date)>=cut;}),lu=l.reduce(function(s,x){return s+uf(x);},0);
  var rec=n?aggRec(ser):null;if(rec)rec.u=u;
  var on=!(RC.stat&&RC.stat.on===false),ppp=n?u/n:0;
  var why=!on?'tier off':(n<SUMT.min?'only '+n+' graded':(ppp<SUMT.ppp?fu(ppp)+' per pick':(lu<0?'last 14 days '+fu(lu):'')));
  return {ok:!why,n:n,u:u,ppp:ppp,lu:lu,ln:l.length,rec:rec,why:why};}
function sumData(){var out={sp:[],loaded:0},keep=S.sport;
  IDS.forEach(function(sp){var st=S.subs[sp];if(!st||!st.got.picks){out.sp.push({sp:sp,wait:true});return;}out.loaded++;
    S.sport=sp;var M=null;try{M=build(sp);}catch(e){out.sp.push({sp:sp,err:true});return;}
    var cache={},D=todayData(M),act=D.act.slice(),rows=[];
    act.forEach(function(p){var T=topTest(M,p,null,cache);rows.push({p:p,T:T,sp:sp,lbl:pickLabel(p,findGame(gidOf(p))),rule:ruleNameOf(M,p),tier:pTier(p),g:gidOf(p),hasG:!!findGame(gidOf(p))});});
    /* A61: one row per bet. When two rules picked it, keep the row whose tier passes the top test, then the better per pick record. */
    var bk={},ord=rows.slice().sort(function(a,b){return (b.T.ok?1:0)-(a.T.ok?1:0)||(b.T.ppp-a.T.ppp);});ord.forEach(function(r){var k=betKey(r.p);if(!bk[k])bk[k]=r;});rows=rows.filter(function(r){return bk[betKey(r.p)]===r;});
    var gr=M.card.filter(function(p){return gradedP(p)&&liveG(p);}),tops=gr.filter(function(p){return [p].concat(p.__also||[]).some(function(x){return topTest(M,x,String(p.date),cache).ok;});});
    var c7=addDays(TODAY,-7);
    var firstT=act.map(function(p){return p.time;}).filter(Boolean).sort(function(a,b){return tmv(a)-tmv(b);})[0]||'';
    out.sp.push({sp:sp,rows:rows,season:aggR(gr),l7:aggR(gr.filter(function(p){return String(p.date)>=c7;})),top:aggR(tops),topAll:tops,gr:gr,first:firstT,pv:D.pv});});
  S.sport=keep;return out;}

      pv=rs.some(function(r){return r.p.__pv;});
    return '<details class="bld sumsp'+SUMPV+'"><summary><b class="sumsn">'+esc(nm)+'</b>'+(pv?'<span class="chip close">Preview</span>':'')+'<span class="small">'+plural(rs.length,'pick')+' · first game '+esc(sumWhen(rs[0].p)||'·')+'</span></summary><div class="sumsb">'+sumByRule(rs)+'</div></details>';}).join('');}
function sumByRule(rs){var G={},ord=[];rs.forEach(function(r){var k=(r.rule||'Other')+'¦'+(r.tier||'');if(!G[k]){G[k]=[];ord.push(k);}G[k].push(r);});
  return ord.map(function(k){var g=G[k],r0=g[0],T=r0.T;
    return '<div class="sumg"><div class="sumgh'+SUMPV+'"><div class="sumgl"><b>'+esc(r0.rule||'Other')+'</b> '+(r0.tier?tierTag(r0.tier,true):'')+'<span class="small"> '+plural(g.length,'pick')+' · first '+esc(sumWhen(r0.p)||'·')+'</span></div>'+
      '<div class="sumgr">'+(T.rec?recU(T.rec):'<span class="mu">·</span>')+(T.n?'<div class="small"><b class="'+uc(T.ppp)+'">'+fu(T.ppp)+'</b> per pick</div>':'')+'</div></div>'+
      smt(['Time','Pick'],g.map(sumRowR),'sumt sumt2')+'</div>';}).join('');}
function sumRowR(r){var p=r.p;
  return '<tr><td class="tmc">'+esc(sumWhen(p))+'</td><td><button type="button" class="lk" data-act="sumgo" data-sp="'+esc(r.sp)+'" data-g="'+esc(r.g)+'" data-id="'+esc(p.__id)+'">'+esc(r.lbl||p.pick)+'</button>'+(p.price!=null&&p.price!==''?' <span class="small">'+esc(fprice(p.price))+'</span>':'')+'<div class="small">'+esc(gameName(p))+'</div></td></tr>';}
function renderSummaryView(){
  document.getElementById('tabs').hidden=true;document.getElementById('sport-name').textContent='Summary';
  var el=document.getElementById('status');
  if(S.dbState==='none'&&!IDS.some(function(sp){return S.subs[sp]&&S.subs[sp].snapAt;})){el.textContent='Sign in to see results';mainEl.innerHTML='<div class="note warn">Open Season Cards from its link while signed in to see results.</div>';return;}
  var D=sumData(),all=[];D.sp.forEach(function(x){if(x.rows)all=all.concat(x.rows);});
  var top=all.filter(function(r){return r.T.ok;});
  el.textContent=top.length+' top performer'+(top.length===1?'':'s')+' · '+all.length+' active picks · '+fdate(TODAY)+(D.loaded<IDS.length?' · loading '+(IDS.length-D.loaded)+' more':'');
  var wait=D.loaded<IDS.length?'<div class="note">Loading '+esc(D.sp.filter(function(x){return x.wait;}).map(function(x){return SPORTS[x.sp].name;}).join(', '))+'. The lists fill in as each sport loads.</div>':'';
  var none=IDS.filter(function(sp){return !top.some(function(r){return r.sp===sp;});}).map(function(sp){var x=D.sp.filter(function(y){return y.sp===sp;})[0]||{};return (sp==='fbs'?'FBS':SPORTS[sp].name)+(x.wait?' (loading)':'');});
  var topT=(top.length?sumBySport(top):'<div class="empty">No active pick passes the test today'+(all.length?' ('+all.length+' active picks checked).':'.')+'</div>')+(none.length?line1('No top performers: '+esc(none.join(', '))+'.'):'');
  var h=wait+'<p class="small sum-i">Active picks whose tier has a proven record: tier on, '+SUMT.min+'+ graded picks, '+fu(SUMT.ppp)+' per pick or better, last '+SUMT.days+' days not negative. Tap a sport to open it; tap a pick for its game card.</p>';
  h+=sec('top','Top performers today',plural(top.length,'pick')+' · of '+plural(all.length,'active pick')+' · by sport, rule and tier','',topT,{open:true,cls:SUMPV});
  mainEl.setAttribute('data-tab','summary');mainEl.innerHTML=h;}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-act="sumgo"]');if(!b)return;e.preventDefault();e.stopPropagation();sumGo(b.getAttribute('data-sp'),b.getAttribute('data-g'),b.getAttribute('data-id'));},true);

/* ---------------- start ---------------- */
var start=location.hash.slice(1);if(start==='fcs')start='fbs';
if(start!=='summary'&&IDS.indexOf(start)<0){start=lsGet(LS_SPORT);if(start==='summary')start='summary';else {if(start==='fcs')start='fbs';if(IDS.indexOf(start)<0)start='nba';}}
setSport(start);
})();
</script>
